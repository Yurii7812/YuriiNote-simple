name: Verify
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check renderer.js
          node --check main.js
          node --check preload.js
      - name: Unit tests
        run: npm test
