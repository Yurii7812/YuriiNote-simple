<title>YuriiNote</title>
<style>
:root{--link:#2f9be0;--bg:#fff;--fg:#2b2d33;--sub:#8b909c;--line:#ececef;--acc:#3b5bdb;--acc-bg:color-mix(in srgb,var(--acc) 12%,white);--red:#c0392b;--paper:#8a5a20;--hl:#f5f6f9;--tint:#eef3ff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,"Noto Sans JP","Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;color:var(--fg);background:var(--bg);height:100vh;display:flex;flex-direction:column}

.bd{position:relative;margin:8px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;resize:vertical;min-height:220px;max-width:100%}

.bd-t{position:absolute;font-size:17px;line-height:1.5;padding:1px 4px;border-radius:4px;white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer;color:var(--fg);outline:none;min-width:8px}
.bd-t:hover{background:var(--acc-bg)}.bd-t.edit{background:var(--acc-bg);cursor:text;user-select:text}.bd-t.move{cursor:grabbing}
.md-table{border-collapse:collapse}.md-table th,.md-table td{border:1px solid var(--line);padding:5px 10px;min-width:4.6em;height:1.9em;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;vertical-align:top;cursor:text}
.md-table th{background:#f6f7f9;font-weight:700;text-align:left}.md-table th:focus,.md-table td:focus{background:var(--acc-bg);box-shadow:inset 0 0 0 2px var(--acc)}
.md-tadd-col,.md-tadd-row{position:absolute;opacity:0;border:1px dashed var(--line);background:var(--bg);color:var(--sub);cursor:pointer;border-radius:6px;font-size:13px;line-height:1;padding:0;transition:opacity .12s}
.md-tw:hover .md-tadd-col,.md-tw:hover .md-tadd-row,.md-tw:focus-within .md-tadd-col,.md-tw:focus-within .md-tadd-row{opacity:.85}
.md-tadd-col:hover,.md-tadd-row:hover{opacity:1;color:var(--acc);border-color:var(--acc)}
.md-tadd-col{top:0;right:0;width:22px;height:calc(100% - 26px)}.md-tadd-row{left:0;bottom:0;height:22px;width:calc(100% - 26px)}

#idbar button.idb{font-size:16px}#idbar button.idb b{font-size:14px}.idline .gid{font-size:18px!important;line-height:1}
.kwlist{display:flex;flex-direction:column;gap:2px}.kwrow{padding:4px 8px;margin:0 -8px;border-radius:7px;font-size:14px;color:var(--acc);cursor:default}.kwrow:hover{background:var(--hl)}
button.ic.dj{width:34px;height:34px;font-size:17px;border:1px solid var(--line);background:var(--bg)}button.ic.dj:hover{background:var(--hl)}button.ic.dj.on{background:var(--acc-bg);border-color:var(--acc)}#dlist .dtop #d-today{flex:1}

<body>
<main>
  <nav id="rail"><button data-mode="notes" title="ノート">📝</button><button data-mode="diary" title="日記">📔</button><button id="memopad" title="メモ帳（今日のメモ帳をすぐ開く）">🗒️</button><button id="more" class="ic" title="メニュー">🧰</button></nav>
  <aside>
    <div id="searchbox"><input id="q" placeholder="検索" title="Ctrl+F　（Esc でやめる）"><button id="sort-key" class="ic"></button><button id="sort-dir" class="ic"></button></div>
    <div id="tabs"><button data-tab="d" title="デジタル"><span class="te">💻</span></button><button data-tab="p" title="紙"><span class="te">📜</span></button><button data-tab="u" title="未整理（IDなし）"><span class="te">📥</span></button><button data-tab="f" title="ファイル（画像・html・csv など）"><span class="te">📎</span></button><button data-tab="i" title="Index（キーワード）"><span class="te">🔖</span></button></div>
    <div id="selbar"></div>
    <div id="list"></div>
  </aside>
  <section id="right">
    <div class="top">
      <button id="nav-back" class="ic" title="戻る (Ctrl+,)" disabled>⬅️</button><button id="nav-fwd" class="ic" title="進む (Ctrl+.)" disabled>➡️</button>
      <div id="tabbar"></div>
      <button id="save-status" class="ic" aria-live="polite" title="保存済み" hidden>⚠️</button>
      <button id="paperonly" class="ic" title="全体を紙だけにする（ノート・Index・トピックIndex）">📜</button><button id="stamp-toggle" class="ic" title="行ごとの時刻を表示・非表示（Ctrl+R）" aria-label="時刻の表示" aria-pressed="true">⏱️</button><button id="new" class="ic" title="新規">➕</button>
      <button id="imp" hidden></button><button id="vault" hidden></button>
    </div>
    <div id="idbar" hidden></div>
    <div id="pane"></div>
  </section>
</main>

<div id="modal" class="modal"><div class="box"></div></div>

<div id="scan" role="dialog" aria-label="紙を取り込む" tabindex="-1">
  <div class="sc-stage">
    <div class="sc-view"><img id="sc-img" alt="" title="押すと、拡大・全体表示を切り替え (Ctrl+E)"></div>
    <div class="sc-strip" id="sc-strip"></div>
  </div>
  <aside class="sc-side">
    <div class="sc-head"><b>📥</b><span id="sc-n"></span><span class="sc-grow"></span><button id="sc-close" class="sc-x" title="閉じる (Esc)">✖️</button></div>
    <div class="sc-bar"><i id="sc-bar-i"></i></div>
    <div class="sc-lab">🆔</div>
    <div class="sc-idrow"><input id="sc-id" autocomplete="off" spellcheck="false" aria-label="紙のID"><span id="sc-mark"></span></div>
    <div id="sc-hint" class="sc-hint"></div>
    <div class="sc-quick">
      <button data-sc-q="sib" title="直前の次（並列）  Ctrl+H" tabindex="-1">↔️ <b id="q-sib"></b><kbd>Ctrl H</kbd></button>
      <button data-sc-q="chi" title="直前の子（分岐）  Ctrl+B" tabindex="-1">🌱 <b id="q-chi"></b><kbd>Ctrl B</kbd></button>
      <button data-sc-q="up" title="直前の親の次  Ctrl+U" tabindex="-1">⤴️ <b id="q-up"></b><kbd>Ctrl U</kbd></button>
    </div>
    <div class="sc-lab">🏷️</div>
    <input id="sc-kw" placeholder="キーワード（、で区切る）" autocomplete="off" aria-label="キーワード">
    <div id="sc-kwchips" class="sc-kcs"></div>
    <button id="sc-save" class="sc-primary" title="保存して次へ  Enter">⏎ 保存して次へ</button>
    <div class="sc-row2">
      <button id="sc-skip" title="飛ばす  Ctrl+S" tabindex="-1">⏭️<kbd>Ctrl S</kbd></button>
      <button id="sc-diary" title="紙の日記に入れる。日付を決めて Enter（Ctrl+D で日付の欄へ）" tabindex="-1">📔<kbd>Ctrl D</kbd></button>
      <input id="sc-date" type="date" aria-label="日記の日付" tabindex="-1">
    </div>
    <div id="sc-msg"></div>
    <div class="sc-keys"><span><kbd>Enter</kbd>保存</span><span><kbd>Tab</kbd>ID⇄キーワード</span><span><kbd>Ctrl K</kbd>前と同じ🏷️</span><span><kbd>Ctrl D</kbd>📔日付→Enter</span><span><kbd>Ctrl E</kbd>拡大</span><span><kbd>PgUp</kbd><kbd>PgDn</kbd>画像を移る</span><span><kbd>Esc</kbd>閉じる</span></div>
  </aside>
</div>
