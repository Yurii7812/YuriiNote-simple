<html lang="ja">
<head>

<title>YuriiNote</title>
<style>

.md-fence{background:#f6f7f9}.md-fence-top{border-radius:6px 6px 0 0;padding-top:2px}.md-fence-end{border-radius:0 0 6px 6px;padding-bottom:2px}.md-fence.md-fence-top:not(:has(+ .md-code-line)){min-height:1em}
.md-li{padding-top:0}.cm-bullet{display:inline-block;width:14px;text-indent:0;color:#777}

.chip.dotted{position:relative;margin-top:9px}

.ix .mk-topic{margin-right:6px}

.item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item{border-bottom:0}.item:hover,.item.on,.ix.on{background:var(--hl)}
.item b{color:var(--acc);margin-right:7px}.item small{color:var(--sub)}
.item.note,.item.topicrow{white-space:normal;display:flex;align-items:center;gap:6px;padding:6px 14px;border:0}
.nrow{min-width:0;flex:1}.nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px;line-height:1.35}

.ix{cursor:default}.ix b{margin-right:6px}
.tag{font-size:12px;color:var(--sub);margin-left:8px}

.sp.p{background:var(--paper)}

.chip:hover{background:var(--hl)}

.nm-panel{font-size:13px}

.idex-main{display:grid;grid-template-columns:minmax(300px,32%) minmax(0,1fr);min-height:0;flex:1}

.idex-section{margin:18px 0 24px}

   リスト行の高さは自然に広げ、タイトル欄は入力中も折り返し自動伸長。 */

  white-space:normal;overflow:visible;text-overflow:clip;
  overflow-wrap:anywhere;word-break:break-word;
}

textarea.ntitle,textarea#f-title{
  display:block;width:100%;box-sizing:border-box;min-width:0;
  min-height:1.45em;height:auto;resize:none;overflow:hidden;
  overflow-wrap:anywhere;white-space:pre-wrap;
  font-family:inherit;field-sizing:content;
}
#idpop{position:fixed;z-index:60;background:#fff;border:1px solid #cfd5e3;border-radius:10px;box-shadow:0 6px 24px rgba(30,40,80,.18);padding:4px;min-width:150px;font-size:14px}#idpop div{padding:6px 10px;border-radius:7px;cursor:pointer}#idpop div.on{background:var(--acc-bg)}#idpop kbd{background:#eef0f5;border-radius:4px;padding:0 5px;font:12px ui-monospace,monospace;color:#667}#idpop b{color:var(--acc);margin-left:4px}

/* 本文は、ページの真ん中。右の欄は右に置き、本文とは別にスクロール（ページの高さに合わせて固定） */

.mermaid-diagram{max-width:100%;min-width:0;margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);overflow:auto}
.mermaid-output{min-width:0;max-width:100%;overflow:auto;text-align:center}
.mermaid-output>svg{display:block;max-width:100%;height:auto;margin:auto}
.mermaid-source{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;text-align:left;max-height:320px;overflow:auto;background:var(--hl);padding:8px;border-radius:6px}
.mermaid-diagram[data-mermaid-status="error"] .mermaid-output{color:var(--red,#b33);text-align:left;white-space:pre-wrap}
.mermaid-diagram[data-mermaid-status="queued"] .mermaid-output,.mermaid-diagram[data-mermaid-status="loading"] .mermaid-output{color:var(--sub)}
.cm-editor .mermaid-diagram{max-width:100%;margin:10px 0}
.chat .bub .mermaid-diagram,.memo-note .mermaid-diagram{width:100%;box-sizing:border-box}
.url-preview-off{border:0!important;border-radius:0;margin:3px 0}.url-preview-off .url-preview-link{display:inline;color:var(--link);padding:0;text-decoration:underline}
/* Linked content uses the surrounding prose typography, with only a thin rule. */
.linked-expansion{font:inherit;line-height:inherit;color:inherit;background:transparent;border:0;border-left:1px solid var(--line);padding:0 0 0 12px;margin:8px 0;min-width:0}
.linked-head{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font:inherit;line-height:1.4;margin-bottom:4px;color:var(--sub)}
.linked-head button,.linked-head select,.linked-head label{font-size:.78em;line-height:1.3;padding:1px 5px;background:transparent;white-space:nowrap}
.linked-head .linked-title{font-size:.85em;color:var(--link);cursor:pointer}.linked-fold{border:0!important}
.linked-prose,.linked-source,.linked-source>div{font:inherit;line-height:inherit;background:transparent;border:0;min-width:0}
.linked-prose p{font:inherit;line-height:inherit;margin:0 0 .35em}.linked-prose h1,.linked-prose h2,.linked-prose h3,.linked-prose h4{font-size:1em;margin:.3em 0;font-weight:600}
.linked-source+.linked-source{margin-top:7px}.linked-source-title{font-size:.8em;color:var(--sub);cursor:pointer}.linked-source time{font-size:.75em;color:var(--sub);margin-left:8px}.linked-paper{display:block;max-width:100%;max-height:420px}
.url-preview{display:flex;align-items:flex-start;position:relative;gap:5px;border:1px solid var(--line);border-radius:5px;max-width:620px;margin:5px 0;min-width:0;background:transparent;font:inherit;line-height:1.35}
.url-preview-link{display:flex;align-items:center;gap:9px;padding:7px;min-width:0;flex:1;cursor:pointer;color:inherit;text-decoration:none}.url-preview-link img{width:64px;height:55px;object-fit:cover;flex:none}.url-preview-link>span{min-width:0;display:flex;flex-direction:column;gap:2px}.url-preview-link b{font-size:.88em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url-preview-link small{font-size:.75em;color:var(--sub);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}.url-menu{flex:none;border:0;background:transparent;padding:2px 8px}
.link-dialog>label{display:flex;flex-direction:column}.link-dialog input{min-width:0;max-width:100%}.link-search{margin-top:10px}.link-search>input{width:100%}.link-results{max-height:220px;overflow:auto;border:1px solid var(--line);margin:5px 0}.link-result{width:100%;display:flex;flex-direction:column;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:5px 8px;white-space:normal}.link-result.on{background:var(--hl)}.link-result small{font-size:12px;color:var(--sub)}
.link-targets{max-height:260px;overflow:auto}.link-target{display:flex;gap:4px;align-items:center;margin:3px 0}.link-target>button:first-child{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;text-align:left}.link-target small{font-size:11px}.link-target>button{flex-shrink:0;padding:2px 6px}.link-backlink{display:block;text-align:left;margin:3px 0}#ln-range-text{width:100%;height:180px;font:inherit}.link-dialog #ln-error,#id-error,#sd-error,#child-error{color:var(--red)}
.reference-picker{position:fixed;z-index:15000;width:min(450px,calc(100vw - 16px));max-height:235px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px #0002;font-size:14px}.reference-help{font-size:11px;color:var(--sub);padding:4px 8px}.reference-candidate{display:flex;gap:3px}.reference-candidate.on{background:var(--hl)}.reference-candidate button{border:0;background:transparent;text-align:left;padding:5px 7px;min-width:0}.reference-candidate button:first-child{flex:1}.reference-candidate small{display:block;font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reference-candidate button:last-child{flex:none}.memo-reference-backlinks{font-size:12px;display:flex;flex-wrap:wrap;gap:6px;color:var(--sub)}
.topic-settings section{margin:10px 0}.topic-settings label{display:block;font-weight:600}.topic-settings input{width:100%}.topic-settings>.row,.topic-bulk>.row{position:sticky;bottom:0;background:var(--bg);padding:8px 0}.topic-danger{border-top:1px solid var(--line);padding-top:8px;margin-top:12px}.topic-danger summary{color:var(--red);cursor:pointer}.topic-bulk fieldset{border:1px solid var(--line);border-radius:5px}.topic-bulk fieldset label{display:block}.topic-bulk #sd-q{width:100%;margin:8px 0}.topic-bulk #sd-u label{display:flex;gap:6px;align-items:center}.topic-bulk #sd-u small{margin-left:auto;color:var(--sub)}.topic-bulk #sd-primary{max-width:100%;margin-left:8px}#sd-preview{max-height:160px;overflow:auto;font-size:12px}
@media(max-width:700px){.link-target{flex-wrap:wrap}.linked-head{gap:4px}.reference-picker{max-width:95vw}.topic-bulk .row{flex-wrap:wrap}}

</style>
</head>
<body>
<main>
  <nav id="rail"><button data-mode="notes" title="ノート">📝</button><button data-mode="diary" title="日記">📔</button><button data-mode="chat" title="チャットメモ">💬</button><button data-mode="pindex" title="紙のIndex（並べ替え）">🗂</button><button data-mode="graph" title="グラフ">🕸</button><button data-mode="mandala" title="曼荼羅">❖</button><button data-mode="cards" title="カード（Google Keep 風・画面いっぱい）">🗒️</button><button id="settings-btn" title="設定">⚙️</button></nav>
  <aside>
    <div id="tabs"><button data-tab="d" title="デジタル"><span class="te">💻</span></button><button data-tab="p" title="紙"><span class="te">📜</span></button><button data-tab="u" title="未整理（IDなし）"><span class="te">📥</span></button><button data-tab="f" title="ファイル（画像・html・csv など）"><span class="te">📎</span></button><button data-tab="i" title="Index（キーワード）"><span class="te">🔖</span></button><button data-tab="0" title="0 Index（親IDの索引）" aria-label="0 Index"><span class="te">0</span></button></div>
    <div id="selbar"></div>
    <div id="list"></div>
  </aside>
  <section id="right">
    <div class="top">
      <button id="nav-back" class="ic" title="戻る (Alt+←)" disabled><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button id="nav-fwd" class="ic" title="進む (Alt+→)" disabled><svg class="ico" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <span class="sp"></span>
      <button id="save-status" class="tbtn" aria-live="polite" title="保存状況">保存済み</button>
      <input id="q" placeholder="検索" title="Ctrl+F　（Esc でやめる）">
      <button id="cardtoggle" class="ic" title="一覧・カードの表示を切り替え"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button><button id="new" class="ic" title="新規"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button id="more" class="ic" title="メニュー"><svg class="ico" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
      <button id="imp" hidden></button><button id="vault" hidden></button>
    </div>
    <div id="tabbar"></div><div id="pane"></div>
  </section>
</main>

<div id="modal" class="modal"><div class="box"></div></div>

<div id="scan">
  <div class="top">
    <b id="sc-n"></b>
    <span>紙のID</span><input id="sc-id" style="width:110px;font-size:18px">
    <span class="sub">キーワード</span><input id="sc-kw" placeholder="任意（、で区切る）">
    <button id="sc-ok" class="p">決定して次へ (Enter)</button>
    <button id="sc-skip">飛ばす</button>
    <span class="sc-diary">｜ 紙の日記なら <input id="sc-date" type="date"><button id="sc-diary" title="Alt+D">日記として登録</button></span>
    <button id="sc-prev">前のID (Tab)</button>
    <button id="sc-close">閉じる (Esc)</button>
    <span id="sc-msg" class="sub"></span>
  </div>
  <div class="view"><img id="sc-img"></div>
</div>
<script src="dist/app.js"></script>
</body>
</html>
